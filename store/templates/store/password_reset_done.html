{% extends "store/base.html" %}
{% block title %}Check your email{% endblock %}
{% block content %}
<div class="auth-page-wrapper">
  <div class="auth-modal-card standalone-card text-center">
    <h2 class="auth-title">Check your email</h2>
    <p class="auth-hint">If an account exists for that email, we have sent a link to set a new password. Check your spam folder too. The link works for 1 hour.</p>
    <p class="mt-4"><a href="{% url 'signin' %}" class="btn-brand">Back to Signin</a></p>
  </div>
</div>
{% endblock %}
