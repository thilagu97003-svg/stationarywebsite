{% extends "store/base.html" %}
{% block title %}Password Changed{% endblock %}
{% block content %}
<div class="auth-page-wrapper">
  <div class="auth-modal-card standalone-card text-center">
    <h2 class="auth-title">Password changed</h2>
    <p class="auth-hint">Your password has been updated. You can sign in with the new password now.</p>
    <p class="mt-4"><a href="{% url 'signin' %}" class="btn-brand">Signin</a></p>
  </div>
</div>
{% endblock %}
